# Render Blueprint: web service only. Uses an existing PostgreSQL instance
# (set DATABASE_URL manually after the Blueprint creates the service) rather
# than provisioning a new database.
# Render dashboard > New > Blueprint > choose this GitHub repository.
services:
  - type: web
    name: edwom-online-mall
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Applies database migrations, ensures the super admin exists, then starts the web server.
    # python3 -m avoids PATH issues with console-script entry points on Render.
    startCommand: python3 -m flask --app wsgi db upgrade && python3 -m flask --app wsgi setup && python3 -m gunicorn wsgi:app -c gunicorn.conf.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO
        value: "1"
      - key: COMMISSION_RATE
        value: "0.08"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
